[settings]
mouse_mode = true
data_compact_columns = true
data_row_spacer = false
autocomplete_enabled = true
autocomplete_debounce_ms = 100
autocomplete_trigger_len = 1
autopairs_enabled = true

[db]
dev-postgres = { host = "localhost", driver = "postgres", port = 5432, database = "", username = "root" }
dev-mysql = { host = "localhost", driver = "mysql", port = 3306, database = "", username = "root"}

[keybindings.Menu]
"<Ctrl-c>" = "Quit"
"q" = "AbortQuery"
"<Alt-1>" = "FocusMenu"
"<Alt-2>" = "FocusEditor"
"<Alt-3>" = "FocusData"
"<Alt-4>" = "FocusHistory"
"<Alt-5>" = "FocusFavorites"
"<Ctrl-k>" = "FocusMenu"
"<Ctrl-j>" = "FocusEditor"
"<Ctrl-h>" = "FocusData"
"<Ctrl-g>" = "FocusHistory"
"<Ctrl-m>" = "FocusFavorites"
"<Tab>" = "CycleFocusForwards"
"<Backtab>" = "CycleFocusBackwards"
"<Alt-minus>" = "DecreaseSectionSize"
"<Alt-+>" = "IncreaseSectionSize"
"<Alt-shift-+>" = "IncreaseSectionSize"

